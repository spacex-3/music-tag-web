name: Build and Push Docker Image

on:
  push:
    branches: [ "master", "dev_1.0" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          # Ensure requirements/prod.txt exists (copy from base.txt if missing)
          if [ ! -f requirements/prod.txt ]; then
            echo "Creating requirements/prod.txt from requirements/base.txt"
            cp requirements/base.txt requirements/prod.txt
          fi
          
          # Ensure setup_in_docker.py exists in root (create dummy if missing to skip obfuscation)
          if [ ! -f setup_in_docker.py ]; then
            echo "Creating dummy setup_in_docker.py to bypass obfuscation step"
            touch setup_in_docker.py
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./compose/prod/django/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ENVIRONMENT=prod