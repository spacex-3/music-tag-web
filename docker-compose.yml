version: '3'

services:
  django:
    image: ghcr.io/spacex-3/music-tag-web:dev_1.0
    container_name: music-tag-web
    ports:
      - "8001:8001"
    volumes:
      - ./media:/app/media:z
      - ./data:/app/data:z
    restart: always
    environment:
      dockerrun: "yes"
    depends_on:
      - redis
    # Symlink default DB path to persisted volume path, then migrate and run
    command: >
      sh -c "ln -sf /app/data/db.sqlite3 /app/db.sqlite3 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001 --insecure"

  celeryworker:
    image: ghcr.io/spacex-3/music-tag-web:dev_1.0
    container_name: music_celeryworker
    environment:
      dockerrun: "yes"
      C_FORCE_ROOT: "1"
    volumes:
      - ./media:/app/media:z
      - ./data:/app/data:z
    depends_on:
      - redis
    restart: always
    # Symlink default DB path to persisted volume path
    command: >
      sh -c "ln -sf /app/data/db.sqlite3 /app/db.sqlite3 &&
             /start-celeryworker"

  celerybeat:
    image: ghcr.io/spacex-3/music-tag-web:dev_1.0
    container_name: music_celerybeat
    environment:
      dockerrun: "yes"
    volumes:
      - ./media:/app/media:z
      - ./data:/app/data:z
    depends_on:
      - redis
    restart: always
    # Symlink default DB path to persisted volume path
    command: >
      sh -c "ln -sf /app/data/db.sqlite3 /app/db.sqlite3 &&
             /start-celerybeat"

  redis:
    image: redis:6-alpine
    restart: always
    container_name: music_redis
