version: '3'

services:
  django:
    image: ghcr.io/spacex-3/music-tag-web:dev_1.0
    container_name: music-tag-web
    ports:
      - "8001:8001"
    volumes:
      - ./media:/app/media:z
      - ./data:/app/data:z
    restart: always
    environment:
      dockerrun: "yes"
      # Using SQLite by default (no MYSQL_* vars needed)
    depends_on:
      - redis
    # Use runserver with --insecure to serve static files without Nginx
    command: python manage.py runserver 0.0.0.0:8001 --insecure

  celeryworker:
    image: ghcr.io/spacex-3/music-tag-web:dev_1.0
    container_name: music_celeryworker
    environment:
      dockerrun: "yes"
    volumes:
      - ./media:/app/media:z
      - ./data:/app/data:z
    depends_on:
      - redis
    restart: always
    command: /start-celeryworker

  celerybeat:
    image: ghcr.io/spacex-3/music-tag-web:dev_1.0
    container_name: music_celerybeat
    environment:
      dockerrun: "yes"
    volumes:
      - ./media:/app/media:z
      - ./data:/app/data:z
    depends_on:
      - redis
    restart: always
    command: /start-celerybeat

  redis:
    image: redis:6-alpine
    restart: always
    container_name: music_redis
